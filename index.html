<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Reestar Restaurant</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Young+Serif&display=swap" rel="stylesheet">
</head>

<body>
    <div class="Header">
        <h1>Reestar</h1>
        <p>Home|Recipe|contact</p>
    </div>
    <div class=" food-container">
        <div class="food-one">
            <img class="food-one__picture" src="./images/food hub img-1.jfif"
                width="150px" height="200px" alt="healty food">
            <h4>French Toast Stack</h4>
            <p>something which is very delicious</p>
            <button class="food-one__button">OrderNow</button>
        </div>
        <div class="food-two">
            <img class="food-two__picture" src="./images/food hub img-2.jfif"
                height="200px" alt="healty food">
            <h4>Avocado Salad Bowl</h4>
            <p>something which is very delicious</p>
            <button class="food-two__button">OrderNow</button>
        </div>
        <div class="food-three">
            <img class="food-three__picture" src="./images/food hub img-3.jfif"
                width="150px" height="200px" alt="healty food">
            <h4>Glazed Chicken Wings</h4>
            <p>something which is very delicious</p>
            <button class="food-three__button">OrderNow</button>
        </div>
        <div class="food-four">
            <img class="food-three__picture" src="./images/food hub img-4.jfif"
                width="150px" height="200px" alt="healty food">
            <h4>Glazed Chicken Wings</h4>
            <p>something which is very delicious</p>
            <button class="food-four__button">OrderNow</button>
        </div>
    </div>
    <div class="contact">
        <h2>Contact Us</h2>
        <form>
            <table>
                <tr class="contact-one__title">
                    <td>Name</td>
                    <td><input type="text" placeholder="Enter your Name"></td> <br>
                </tr>
                <tr class="contact-two__num">
                    <td>Age</td>
                    <td><input type="number" placeholder="Enter your Age"></td> <br>
                </tr>
                <tr class="contact-three__desc">
                    <td>Email</td>
                    <td><input type="Email" placeholder="Enter your Email"></td> <br>
                </tr>
                <tr>
                    <td colspan="2" class="contact-four__click"><button type="submit">Send</button></td>
                </tr>

            </table>
        </form>
    </div>
</body>

</html>
